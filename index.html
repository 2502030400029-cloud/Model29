<!DOCTYPE html>
<html>
<head>
    <title>Simple AI Chatbot</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            display: flex;
            justify-content: center;
            padding-top: 50px;
        }

        .chatbox {
            width: 400px;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        #chat {
            height: 300px;
            overflow-y: auto;
            border: 1px solid #ddd;
            padding: 10px;
            margin-bottom: 10px;
        }

        input {
            width: 70%;
            padding: 10px;
        }

        button {
            padding: 10px 15px;
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
        }

        .user {
            color: blue;
            margin: 8px 0;
        }

        .ai {
            color: green;
            margin: 8px 0;
        }
    </style>
</head>

<body>

<div class="chatbox">
    <h2>🤖 Simple AI Chatbot</h2>

    <div id="chat"></div>

    <input type="text" id="userInput" placeholder="Ask something...">
    <button onclick="sendMessage()">Send</button>
</div>

<script>

function sendMessage() {

    let input = document.getElementById("userInput");
    let message = input.value.toLowerCase();

    if (message == "") {
        return;
    }

    let chat = document.getElementById("chat");

    chat.innerHTML += 
        "<div class='user'><b>You:</b> " + input.value + "</div>";

    let reply = getAIResponse(message);

    chat.innerHTML += 
        "<div class='ai'><b>AI:</b> " + reply + "</div>";

    input.value = "";
    chat.scrollTop = chat.scrollHeight;
}


function getAIResponse(message) {

    if (message.includes("hello") || message.includes("hi")) {
        return "Hello! How can I help you?";
    }

    else if (message.includes("name")) {
        return "My name is Simple AI.";
    }

    else if (message.includes("resume")) {
        return "I can help you create a professional resume.";
    }

    else if (message.includes("html")) {
        return "HTML is used to create the structure of a website.";
    }

    else if (message.includes("thank")) {
        return "You're welcome! 😊";
    }

    else if (message.includes("bye")) {
        return "Goodbye! Have a nice day.";
    }

    else {
        return "Sorry, I don't understand that yet.";
    }
}

</script>

</body>
</html>
